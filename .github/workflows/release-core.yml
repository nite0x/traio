name: Release Core binaries

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate tag
        env:
          CORE_VERSION: ${{ github.ref_name }}
        run: |
          python3 -c 'import os, re; assert re.fullmatch(r"v\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?", os.environ["CORE_VERSION"]), "invalid Core release tag"'
          test "$(git rev-list -n 1 "$CORE_VERSION")" = "$(git rev-parse HEAD)"
      - run: go test ./...
      - run: go vet ./...
      - name: Build all six targets and checksums
        env:
          CORE_VERSION: ${{ github.ref_name }}
        run: python3 scripts/build-core-release.py --version "$CORE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: core-release
          path: dist/core/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: core-release
          path: dist/core
      - name: Publish assets on the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CORE_VERSION: ${{ github.ref_name }}
        run: |
          cd dist/core
          sha256sum --check SHA256SUMS
          flags=(--latest)
          if [[ "$CORE_VERSION" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$CORE_VERSION" ./* --verify-tag \
            --title "Traio Core $CORE_VERSION" --generate-notes "${flags[@]}"
